# SPDX-License-Identifier: MIT
# What ci-shared syncs into sharerr-rs, and its own values in the shared rulesets.
repository = "ivylikethevine/sharerr-rs"
# the branch sync pull requests go to: main or dev
sync_branch = "dev"

# paths from files/, each at the path it has in this repository
files = [
  ".editorconfig",
  ".github/CODEOWNERS",
  ".github/actions/advisory-note/action.yml",
  ".github/actions/apt/lib.sh",
  ".github/actions/fetch-latest-artifact/action.yml",
  ".github/actions/mark-tree/action.yml",
  ".github/actions/setup-tool/action.yml",
  ".github/actions/setup-tool/install.sh",
  ".github/actions/setup-tool/lib.sh",
  ".github/actions/setup-tools/action.yml",
  ".github/actions/setup-tools/install-missing.sh",
  ".github/actions/setup-tools/resolve.sh",
  ".github/actions/upsert-tracking-issue/action.yml",
  ".github/allowed_signers",
  ".github/osv-scanner.toml",
  ".github/package-lock.json",
  ".github/package.json",
  ".github/scripts/check_tool_versions.sh",
  ".github/scripts/find_tree_run.sh",
  ".github/scripts/lib.sh",
  ".github/scripts/lint_workflows.sh",
  ".github/scripts/release_notes.sh",
  ".github/scripts/scan_pinned_images.sh",
  ".github/scripts/trivy_scan.sh",
  ".github/workflows/cancel-closed-pr.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/link-check.yml",
  ".github/workflows/pages.yml",
  ".github/workflows/release-note.yml",
  ".github/workflows/scorecard.yml",
  ".github/workflows/tool-versions.yml",
  ".github/zizmor.yml",
  ".markdownlint.yaml",
  ".prettierrc.yaml",
  ".shellcheckrc",
  "docs/CODE_OF_CONDUCT.md",
  "lychee.toml",
]

# the values a template takes, by path
[templates.".github/workflows/codeql.yml"]
language = "rust"
Language = "Rust"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = [
  { context = "cargo-deny", integration_id = 15368 },
  { context = "clippy + tests", integration_id = 15368 },
  { context = "dependency review", integration_id = 15368 },
  { context = "docker (lighthouse) / build", integration_id = 15368 },
  { context = "docker (sharerr) / build", integration_id = 15368 },
  { context = "docs (markdownlint + prettier + typos)", integration_id = 15368 },
  { context = "markdown links (lychee offline)", integration_id = 15368 },
  { context = "msrv", integration_id = 15368 },
  { context = "release note (pr body)", integration_id = 15368 },
  { context = "rustfmt", integration_id = 15368 },
  { context = "secrets (gitleaks)", integration_id = 15368 },
  { context = "shell + compose", integration_id = 15368 },
  { context = "terraform (fmt + validate)", integration_id = 15368 },
  { context = "workflow lint (zizmor + actionlint)", integration_id = 15368 },
]
code_scanning_tools = ["CodeQL", "Scorecard", "Trivy"]
code_quality = true
code_coverage = { minimum_coverage = 90, max_coverage_drop = 2 }
