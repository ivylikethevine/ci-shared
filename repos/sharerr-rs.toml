# SPDX-License-Identifier: MIT
# What ci-shared syncs into sharerr-rs, and its own values in the shared rulesets.
repository = "ivylikethevine/sharerr-rs"
# the branch sync pull requests go to: main or dev
sync_branch = "dev"

# paths from files/, each at the path it has in this repository
files = [
  ".editorconfig",
  ".gitattributes",
  ".github/CODEOWNERS",
  ".github/ISSUE_TEMPLATE/config.yml",
  ".github/actionlint.yaml",
  ".github/actions/advisory-note/action.yml",
  ".github/actions/apt/lib.sh",
  ".github/actions/fetch-latest-artifact/action.yml",
  ".github/actions/mark-tree/action.yml",
  ".github/actions/setup-tool/action.yml",
  ".github/actions/setup-tool/install.sh",
  ".github/actions/setup-tool/lib.sh",
  ".github/actions/setup-tool/tools.txt",
  ".github/actions/setup-tools/action.yml",
  ".github/actions/setup-tools/install-missing.sh",
  ".github/actions/setup-tools/resolve.sh",
  ".github/actions/upsert-tracking-issue/action.yml",
  ".github/allowed_signers",
  ".github/dependabot.yml",
  ".github/osv-scanner.toml",
  ".github/package-lock.json",
  ".github/package.json",
  ".github/pull_request_template.md",
  ".github/scripts/check_tool_versions.sh",
  ".github/scripts/find_tree_run.sh",
  ".github/scripts/lib.sh",
  ".github/scripts/lint_workflows.sh",
  ".github/scripts/release_notes.sh",
  ".github/scripts/scan_pinned_images.sh",
  ".github/scripts/trivy_scan.sh",
  ".github/workflows/advisories.yml",
  ".github/workflows/cancel-closed-pr.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/image-scan.yml",
  ".github/workflows/link-check.yml",
  ".github/workflows/pages.yml",
  ".github/workflows/release-note.yml",
  ".github/workflows/scorecard.yml",
  ".github/workflows/tool-versions.yml",
  ".github/zizmor.yml",
  ".gitignore",
  ".markdownlint.yaml",
  ".moxide.toml",
  ".prettierrc.yaml",
  ".shellcheckrc",
  ".vscode/settings.json",
  ".zed/settings.json",
  "LICENSE.md",
  "_config.yml",
  "docs/CODE_OF_CONDUCT.md",
  "lychee.toml",
]

# the values a template takes, by path
[templates.".github/workflows/image-scan.yml"]
pins_egress = "audit"
image_name = "sharerr"
trivyignore = "docker/.trivyignore"

[templates.".github/workflows/codeql.yml"]
language = "rust"

[templates.".vscode/settings.json"]
rust = "true"

[templates.".zed/settings.json"]
rust = "true"

[templates."_config.yml"]
title = "sharerr"
description = "Share your media library with friends, over the tools you already run."

[templates.".github/workflows/advisories.yml"]
rust = "true"
tool = "cargo-deny"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = [
  { context = "cargo-deny" },
  { context = "clippy + tests" },
  { context = "dependency review" },
  { context = "docker (lighthouse) / build" },
  { context = "docker (sharerr) / build" },
  { context = "docs (markdownlint + prettier + typos)" },
  { context = "markdown links (lychee offline)" },
  { context = "msrv" },
  { context = "release note (pr body)" },
  { context = "rustfmt" },
  { context = "secrets (gitleaks)" },
  { context = "shell + compose" },
  { context = "terraform (fmt + validate)" },
  { context = "workflow lint (zizmor + actionlint)" },
]
code_scanning_tools = ["CodeQL", "Scorecard", "Trivy"]
code_quality = true
code_coverage = { minimum_coverage = 90, max_coverage_drop = 2 }
