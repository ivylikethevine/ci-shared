# SPDX-License-Identifier: MIT
# What ci-shared syncs into python-constricter, and its own values in the shared rulesets.
repository = "ivylikethevine/python-constricter"
# the branch sync pull requests go to: main or dev
sync_branch = "dev"

# paths from files/, each at the path it has in this repository
files = [
  ".editorconfig",
  ".github/CODEOWNERS",
  ".github/actions/upsert-tracking-issue/action.yml",
  ".github/osv-scanner.toml",
  ".github/package-lock.json",
  ".github/package.json",
  ".github/scripts/check_tool_versions.sh",
  ".github/scripts/lib.sh",
  ".github/scripts/release_notes.sh",
  ".github/workflows/cancel-closed-pr.yml",
  ".github/workflows/release-note.yml",
  ".github/workflows/scorecard.yml",
  ".github/workflows/tool-versions.yml",
  ".github/zizmor.yml",
  "docs/CODE_OF_CONDUCT.md",
  "lychee.toml",
]

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = []
code_scanning_tools = ["CodeQL"]
code_quality = true
code_coverage = { minimum_coverage = 100, max_coverage_drop = 0 }
