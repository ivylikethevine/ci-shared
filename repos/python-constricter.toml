# What ci-shared syncs into python-constricter, and its own values in the shared rulesets.
repository = "ivylikethevine/python-constricter"
# the branch sync pull requests go to: main or dev
sync_branch = "main"
# GitHub's immutable releases (Settings → General → Releases), compared by
# scripts/rulesets.sh diff where the token can read it
immutable_releases = true

# repos/_base.toml's paths, less any `skip` names
base = true

# the values every template takes
[values]
language = "python"

# the values a template takes, by path
[templates.".gitignore"]
stray_files = "true"

[templates.".github/workflows/rerun-timeouts.yml"]
workflows = "CI, Security, CodeQL, Scorecard, Release note, Link check, Tool versions"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = []
code_scanning_tools = ["CodeQL"]
code_quality = true
code_coverage = { minimum_coverage = 100, max_coverage_drop = 0 }
