# SPDX-License-Identifier: MIT
# What ci-shared syncs into say-hi, and its own values in the shared rulesets.
repository = "ivylikethevine/say-hi"
# the branch sync pull requests go to: main or dev
sync_branch = "dev"

# paths from files/, each at the path it has in this repository
files = [
  ".editorconfig",
  ".gitattributes",
  ".github/CODEOWNERS",
  ".github/ISSUE_TEMPLATE/config.yml",
  ".github/actionlint.yaml",
  ".github/actions/advisory-note/action.yml",
  ".github/actions/apt/lib.sh",
  ".github/actions/fetch-latest-artifact/action.yml",
  ".github/actions/mark-tree/action.yml",
  ".github/actions/setup-tool/action.yml",
  ".github/actions/setup-tool/install.sh",
  ".github/actions/setup-tool/lib.sh",
  ".github/actions/setup-tool/tools.txt",
  ".github/actions/setup-tools/action.yml",
  ".github/actions/setup-tools/install-missing.sh",
  ".github/actions/setup-tools/resolve.sh",
  ".github/actions/upsert-tracking-issue/action.yml",
  ".github/allowed_signers",
  ".github/dependabot.yml",
  ".github/osv-scanner.toml",
  ".github/package-lock.json",
  ".github/package.json",
  ".github/pull_request_template.md",
  ".github/scripts/check_tool_versions.sh",
  ".github/scripts/find_tree_run.sh",
  ".github/scripts/lib.sh",
  ".github/scripts/lint_workflows.sh",
  ".github/scripts/release_notes.sh",
  ".github/scripts/scan_pinned_images.sh",
  ".github/workflows/cancel-closed-pr.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/image-scan.yml",
  ".github/workflows/link-check.yml",
  ".github/workflows/release-note.yml",
  ".github/workflows/scorecard.yml",
  ".github/workflows/tool-versions.yml",
  ".github/zizmor.yml",
  ".gitignore",
  ".markdownlint.yaml",
  ".moxide.toml",
  ".prettierrc.yaml",
  ".shellcheckrc",
  ".vscode/settings.json",
  ".zed/settings.json",
  "LICENSE.md",
  "LICENSES/MIT.txt",
  "REUSE.toml",
  "_config.yml",
  "docs/CODE_OF_CONDUCT.md",
  "lychee.toml",
]

# the values a template takes, by path
[templates.".gitignore"]
images = "true"
stray_files = "true"

[templates."_config.yml"]
title = "say-hi"
description = "A greeting, a prompt, and your aliases on every machine you ssh, docker, podman, nomad, or kubectl into - without installing anything there."

[templates.".github/workflows/image-scan.yml"]
pins_egress = "block"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = [
  { context = "dependency review" },
  { context = "e2e (podman, nomad, kube)" },
  { context = "e2e (ssh, docker)" },
  { context = "fast suites (macos-latest)" },
  { context = "fast suites (ubuntu-26.04)" },
  { context = "lint suites (ubuntu-26.04)" },
  { context = "package build (deb, rpm, apk)" },
  { context = "release note (pr body)" },
  { context = "secret scan (gitleaks)" },
]
code_scanning_tools = ["CodeQL", "Scorecard"]
code_quality = true
