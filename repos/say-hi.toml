# What ci-shared syncs into say-hi, and its own values in the shared rulesets.
repository = "ivylikethevine/say-hi"
# the branch sync pull requests go to: main or dev
sync_branch = "main"

# repos/_base.toml's paths, less any `skip` names
base = true

# paths from files/ beyond those, each at the path it has in this repository
files = [
  ".github/actions/advisory-note/action.yml",
  ".github/actions/fetch-latest-artifact/action.yml",
  ".github/actions/mark-tree/action.yml",
  ".github/allowed_signers",
  ".github/scripts/find_tree_run.sh",
  ".github/scripts/scan_pinned_images.sh",
  ".github/workflows/image-scan.yml",
  "_config.yml",
]

# the values a template takes, by path
[templates.".gitignore"]
images = "true"
stray_files = "true"

[templates."_config.yml"]
title = "say-hi"
description = "A greeting, a prompt, and your aliases on every machine you ssh, docker, podman, nomad, or kubectl into - without installing anything there."

[templates.".github/workflows/image-scan.yml"]
pins_egress = "block"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = [
  { context = "dependency review" },
  { context = "e2e (podman, nomad, kube)" },
  { context = "e2e (ssh, docker)" },
  { context = "fast suites (macos-latest)" },
  { context = "fast suites (ubuntu-26.04)" },
  { context = "lint suites (ubuntu-26.04)" },
  { context = "package build (deb, rpm, apk)" },
  { context = "release note (pr body)" },
  { context = "secret scan (gitleaks)" },
]
# Scorecard is left out: its pull_request run grades the checkout locally, and
# the score the badge shows comes from the runs on main
code_scanning_tools = ["CodeQL"]
code_quality = true
