# What ci-shared syncs into homebrew-tap, and its own values in the shared rulesets.
repository = "ivylikethevine/homebrew-tap"
# the branch sync pull requests go to: main or dev
sync_branch = "main"

# repos/_base.toml's paths, less any `skip` names
base = true
skip = [
  ".gitattributes",
  ".github/ISSUE_TEMPLATE/config.yml",
  ".github/osv-scanner.toml",
  ".github/package-lock.json",
  ".github/package.json",
  ".github/pull_request_template.md",
  ".github/scripts/release_notes.sh",
  ".github/workflows/cancel-closed-pr.yml",
  ".github/workflows/codeql.yml",
  ".github/workflows/link-check.yml",
  ".github/workflows/release-note.yml",
  ".github/workflows/scorecard.yml",
  ".markdownlint.yaml",
  ".moxide.toml",
  ".prettierrc.yaml",
  ".scorecard.yml",
  ".zed/settings.json",
  "lychee.toml",
]

# the values a template takes, by path
[templates.".gitignore"]
stray_files = "true"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = [
  { context = "tests" },
]
code_scanning_tools = []
code_quality = false
