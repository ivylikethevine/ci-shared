# What ci-shared syncs into instadroid, and its own values in the shared rulesets.
repository = "ivylikethevine/instadroid"
# the branch sync pull requests go to: main or dev
sync_branch = "main"

# repos/_base.toml's paths, less any `skip` names
base = true

# paths from files/ beyond those, each at the path it has in this repository
files = [
  ".github/actions/advisory-note/action.yml",
  ".github/actions/fetch-latest-artifact/action.yml",
  ".github/allowed_signers",
  ".github/scripts/scan_pinned_images.sh",
  ".github/scripts/trivy_scan.sh",
  ".github/workflows/advisories.yml",
  ".github/workflows/image-scan.yml",
  ".github/workflows/pages.yml",
  "_config.yml",
]

# the values every template takes
[values]
language = "python"

# the values a template takes, by path
[templates.".gitignore"]
images = "true"
stray_files = "true"

[templates.".github/workflows/image-scan.yml"]
pins_egress = "audit"
image_name = "instadroid"
trivyignore = ".trivyignore"

[templates."_config.yml"]
title = "instadroid"
description = "A real, logged-in Instagram Android app running in redroid, publishing the chronological Following feed as Atom for FreshRSS."

[templates.".github/workflows/advisories.yml"]
tool = "pip-audit"

# this repository's values in rulesets/main.json
[rulesets.main]
required_status_checks = [
  { context = "CI result" },
  { context = "CodeQL (actions)" },
  { context = "CodeQL (python)" },
  { context = "release note (pr body)" },
]
code_scanning_tools = ["CodeQL", "Scorecard", "Trivy"]
code_quality = false
code_coverage = { minimum_coverage = 90, max_coverage_drop = 2 }
