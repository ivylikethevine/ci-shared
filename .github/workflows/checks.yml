name: Checks

# The checks this repository ships, run over the repository itself and the
# shared copies in files/: scripts/check.sh, the same command a local run uses.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # job-scoped, not workflow-level, for Scorecard's Token-Permissions check
    permissions:
      contents: read
    steps:
      # block: the checkout, the pinned tools' release downloads, the npm
      # registry, the cache service, and the API zizmor's online audits read.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: shellcheck shfmt actionlint zizmor yq

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install the pinned Markdown tools
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Run the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check.sh
