name: CI

# The checks this repository ships, run over the repository itself and the
# shared copies in files/: scripts/check.sh, the same command a local run uses.
on:
  push:
    branches: [main]
  # drafts check nothing (the jobs' `if`) until ready_for_review; a PR turned
  # back into a draft cancels its run
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      # a runner image to try before the pin below moves to it, e.g.
      # ubuntu-28.04; the jobs run on ubuntu-26.04 otherwise
      runner:
        description: Runner label for both jobs
        required: false

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event.pull_request.draft != true
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 5
    # job-scoped, not workflow-level, for Scorecard's Token-Permissions check
    permissions:
      contents: read
    steps:
      # audit: no write token here, and block leaves the job open until its limit
      # on a westus2 runner (docs/ROADMAP.md, item 5.1)
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # the whole history, which gitleaks scans
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: shellcheck shfmt actionlint zizmor yq typos gitleaks lychee

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install the pinned Markdown tools
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      # the runner's python3, a venv holding requirements-dev.txt's hashed pins
      - name: Install the pinned Python tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      - name: Run the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check.sh

  coverage:
    name: Coverage
    if: github.event.pull_request.draft != true
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # audit, as above
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: shfmt yq

      # bashcov is a rubygem, which no tools.txt kind fetches, so its pin is
      # this env, in CI_WORKFLOW_ROSTER (check_tool_versions.local.sh). ruby is
      # on the hosted images. The pin answers zizmor's ad-hoc install finding:
      # a Gemfile and lock for one gem would add nothing.
      - name: Install bashcov
        env:
          BASHCOV_VERSION: "4.0.1"
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          gem install --user-install --no-document bashcov -v "$BASHCOV_VERSION"

      # the runner's python3, a venv holding coverage's hashed pin alone
      - name: Install coverage
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps -r requirements-coverage.txt
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      - name: Run the tests under bashcov and coverage.py, failing below 100%
        run: tests/coverage.sh
