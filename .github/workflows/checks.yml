name: CI

# The checks this repository ships, run over the repository itself and the
# shared copies in files/: scripts/check.sh, the same command a local run uses.
on:
  push:
    branches: [main]
  # drafts check nothing (the jobs' `if`) until ready_for_review; a PR turned
  # back into a draft cancels its run
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      # a runner image to try before the pin below moves to it, e.g.
      # ubuntu-28.04; the jobs run on ubuntu-26.04 otherwise
      runner:
        description: Runner label for both jobs
        required: false

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event.pull_request.draft != true
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    # job-scoped, not workflow-level, for Scorecard's Token-Permissions check
    permissions:
      contents: read
    steps:
      # block: the checkout, the pinned tools' release downloads, the npm
      # registry, PyPI, the cache service, and the API zizmor's online audits
      # read.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443

      # the whole history, which gitleaks scans
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: shellcheck shfmt actionlint zizmor yq typos gitleaks lychee

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install the pinned Markdown tools
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      # the runner's python3, a venv holding requirements-dev.txt's hashed pins
      - name: Install the pinned Python tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      - name: Run the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check.sh

  coverage:
    name: Coverage
    if: github.event.pull_request.draft != true
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # block: the checkout, the cache service, the pinned tools' release
      # downloads and kcov's source tarball (codeload), PyPI, and the Ubuntu
      # archive for kcov's build deps and runtime libraries.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kcov's runtime libraries, which tools.txt leaves to the caller
      - name: Install kcov's runtime libraries
        run: |
          set -euo pipefail
          source .github/actions/apt/lib.sh
          _ci_apt_install libdw1 libelf1 libcurl4 zlib1g libstdc++6

      # kcov built from its upstream source tarball (tools.txt's cmake row) and
      # cached; Ubuntu's 43+dfsg-2 records no hit on a multi-line array
      - uses: ./.github/actions/setup-tools
        with:
          tools: shfmt yq kcov

      # the runner's python3, a venv holding requirements-dev.txt's hashed pins
      - name: Install the pinned Python tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps -r requirements-dev.txt
          echo "$RUNNER_TEMP/venv/bin" >>"$GITHUB_PATH"

      - name: Run the tests under kcov and coverage.py, failing below 100%
        run: tests/coverage.sh
