name: Sync

# Opens or updates a pull request in each repos/ repository whose copies of
# the shared files differ from files/. Each run mints one token per target
# from the sync GitHub App (client ID in the `sync` environment's variable
# SYNC_APP_CLIENT_ID, private key in its secret SYNC_APP_PRIVATE_KEY), scoped
# to that repository alone, with the App's Contents, Pull requests and
# Workflows read/write and Checks and Commit statuses read; each is revoked
# when the job ends. The commits are signed with SYNC_SIGNING_KEY. This
# workflow's own token reads this repository and writes only its
# `sync-health` issue. A target gets nothing unless its main and dev pass
# scripts/check_protection.sh. The run's job summary lists what each target
# got, file by file. The weekly run writes nothing to a target: it fails once
# the App cannot mint a target's token, a target's protection has slipped, a
# target differs from files/ with no
# sync pull request open, a target's rulesets differ from rulesets/, or (with
# the repository variable SYNC_PR_REPORT set to `true`) a sync pull request
# has a failed check or has stayed open too long, and keeps the `sync-health`
# issue open until a weekly run passes them all.
on:
  # only a push that changes what a target receives, or the rulesets it should
  # have; a change to the scripts alone (ci_render's included) reaches the
  # targets on the next dispatch
  push:
    branches: [main]
    paths:
      - files/**
      - repos/**
      - rulesets/**
  schedule:
    - cron: "41 14 * * 1"
  workflow_dispatch:
    inputs:
      repos:
        description: Repository names to sync, space-separated (empty syncs all)
        required: false
        default: ""
      dry-run:
        description: Report what differs and write nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # SYNC_APP_PRIVATE_KEY and SYNC_SIGNING_KEY are secrets of this
    # environment, whose deployment branches are main alone, so no other ref's
    # run reads them
    environment: sync
    # job-scoped, not workflow-level, for Scorecard's Token-Permissions check
    permissions:
      contents: read
    outputs:
      tokens: ${{ steps.tokens.outcome }}
      protection: ${{ steps.protection.outcome }}
      drift: ${{ steps.drift.outcome }}
      rulesets: ${{ steps.rulesets.outcome }}
      prs: ${{ steps.prs.outcome }}
    # this job's own read-only token, for this repository's main
    # (rulesets/self.toml), which the protection and rulesets checks cover;
    # the tokens step below adds one SYNC_TOKEN_<NAME> per target
    env:
      SYNC_TOKEN_CI_SHARED: ${{ github.token }}
    steps:
      # lint_workflows.sh rule 6 says why this comes first
      - id: dns-experiment
        name: Refuse a runner on the DNS experiment
        run: |
          if systemctl is-active --quiet egress-dns-resolver.service; then
            echo "::error title=dns experiment::This runner is on the hosted-runner DNS experiment, where egress-policy block never finishes. Rerun the job."
            exit 1
          fi

      # block, not audit: the checkout and the GitHub API are all this job
      # reaches.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # one token per repos/<name>.toml, whatever the repos input names, each
      # scoped to its target alone and to the README's permissions, which the
      # App must hold (zizmor: github-app). A target the App cannot reach (not
      # installed there) gets none: the tokens step fails and the scripts
      # skip that target, while the others still sync.
      - id: app-homebrew-tap
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          repositories: homebrew-tap
      - id: app-instadroid
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          repositories: instadroid
      - id: app-python-constricter
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          repositories: python-constricter
      - id: app-say-hi
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          repositories: say-hi
      - id: app-sharerr-rs
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          repositories: sharerr-rs

      # the scripts read target <name>'s token as SYNC_TOKEN_<NAME>, its name
      # in capitals with `-` as `_`; each TOKEN_<NAME> below becomes one. The
      # steps after run whatever this one finds.
      - id: tokens
        name: Pass the targets' tokens to the steps below
        env:
          TOKEN_HOMEBREW_TAP: ${{ steps.app-homebrew-tap.outputs.token }}
          TOKEN_INSTADROID: ${{ steps.app-instadroid.outputs.token }}
          TOKEN_PYTHON_CONSTRICTER: ${{ steps.app-python-constricter.outputs.token }}
          TOKEN_SAY_HI: ${{ steps.app-say-hi.outputs.token }}
          TOKEN_SHARERR_RS: ${{ steps.app-sharerr-rs.outputs.token }}
        run: |
          set -euo pipefail
          missing=()
          for var in $(compgen -v TOKEN_); do
            if [ -n "${!var}" ]; then
              echo "SYNC_$var=${!var}" >>"$GITHUB_ENV"
            else
              missing+=("${var#TOKEN_}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=tokens::the sync App minted no token for ${missing[*]}"
            exit 1
          fi

      # every target, on the runs where the sync below does not check each
      # one itself: the weekly run and a dry run write nothing, and a run
      # limited to named targets leaves the others unchecked
      - id: protection
        name: Check the targets' branch protection
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.dry-run || inputs.repos != '') }}
        run: scripts/check_protection.sh

      # the weekly run: a target that differs with no sync pull request open
      # was edited by hand, or its pull request was closed unmerged
      - id: drift
        name: Check the targets for drift
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/sync_remote.sh --drift

      # the weekly run: a ruleset edited by hand on a target. A push that
      # changed rulesets/ runs it too, so the edit's diff against the live
      # rulesets shows the same day.
      - id: rulesets
        name: Compare the targets' rulesets with rulesets/
        if: >-
          ${{ !cancelled() && (github.event_name == 'schedule' ||
          (github.event_name == 'push' &&
          (contains(toJSON(github.event.commits.*.added), '"rulesets/') ||
          contains(toJSON(github.event.commits.*.modified), '"rulesets/') ||
          contains(toJSON(github.event.commits.*.removed), '"rulesets/')))) }}
        run: scripts/rulesets.sh diff

      # the weekly run: a shared file that breaks a target fails the checks on
      # its sync pull request. Off unless the repository variable
      # SYNC_PR_REPORT is `true`: the tokens need Checks and Commit statuses
      # read first.
      - id: prs
        name: Report on the open sync pull requests
        if: ${{ !cancelled() && github.event_name == 'schedule' && vars.SYNC_PR_REPORT == 'true' }}
        run: scripts/sync_prs.sh

      - name: Open or update the sync pull requests
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        # via env, never inline ${{ }} in the run block (zizmor:
        # template-injection)
        env:
          SOURCE_SHA: ${{ github.sha }}
          # the targets require signed commits; the key's public half is a
          # signing key of the account that owns this email
          SYNC_SIGNING_KEY: ${{ secrets.SYNC_SIGNING_KEY }}
          SYNC_COMMITTER_NAME: Ivy Duggan
          SYNC_COMMITTER_EMAIL: ivylikethevine@gmail.com
          REPOS: ${{ inputs.repos }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          # one repository name per word
          read -r -a names <<<"$REPOS"
          scripts/sync_remote.sh ${args[@]+"${args[@]}"} ${names[@]+"${names[@]}"}

  # The weekly checks' tracking issue, in a job of its own so the token that
  # writes issues never shares a job with the sync secrets. The body names the
  # failed checks; the details stay in the run's log.
  health:
    name: Sync health
    needs: sync
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write # upsert (and close) its own tracking issue
    steps:
      # lint_workflows.sh rule 6 says why this comes first
      - id: dns-experiment
        name: Refuse a runner on the DNS experiment
        run: |
          if systemctl is-active --quiet egress-dns-resolver.service; then
            echo "::error title=dns experiment::This runner is on the hosted-runner DNS experiment, where egress-policy block never finishes. Rerun the job."
            exit 1
          fi

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # for the local action alone
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # a check skipped by an earlier failure has no outcome and reads as not
      # run, not as failed
      - id: body
        name: Compose the tracking issue body
        env:
          TOKENS: ${{ needs.sync.outputs.tokens }}
          PROTECTION: ${{ needs.sync.outputs.protection }}
          DRIFT: ${{ needs.sync.outputs.drift }}
          RULESETS: ${{ needs.sync.outputs.rulesets }}
          # `off` while SYNC_PR_REPORT leaves the report off, which passes
          PRS: ${{ vars.SYNC_PR_REPORT == 'true' && needs.sync.outputs.prs || 'off' }}
        run: |
          set -euo pipefail
          # line <outcome> <script> <what its failure means>
          line() {
            case $1 in
            success | off) ;;
            failure) echo "- \`$2\`: $3" ;;
            *) echo "- \`$2\`: did not run (${1:-no outcome})" ;;
            esac
          }
          {
            echo "The weekly sync checks did not pass; the run's log has the details."
            echo
            line "$TOKENS" create-github-app-token "the sync App minted no token for a target: not installed there, lacking a permission the mint step requests, or SYNC_APP_CLIENT_ID or SYNC_APP_PRIVATE_KEY is unset"
            line "$PROTECTION" scripts/check_protection.sh "a target's main or dev is not protected from its token"
            line "$DRIFT" "scripts/sync_remote.sh --drift" "a target differs from files/ with no sync pull request open, or could not be read"
            line "$RULESETS" "scripts/rulesets.sh diff" "a target's rulesets differ from rulesets/, or could not be read"
            line "$PRS" scripts/sync_prs.sh "a sync pull request has a failed check, no checks or has been open over two weeks, or could not be read"
          } >"$RUNNER_TEMP/issue.md"
          ok=true
          for outcome in "$TOKENS" "$PROTECTION" "$DRIFT" "$RULESETS" "$PRS"; do
            [ "$outcome" = success ] || [ "$outcome" = off ] || ok=false
          done
          echo "resolved=$ok" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: sync-health
          label-color: B60205
          label-description: A weekly sync check failed
          title: The weekly sync checks failed
          resolved: ${{ steps.body.outputs.resolved }}
          close-comment: Every weekly sync check passes again.
          resolved-when: a weekly run passes every check
          body-file: ${{ runner.temp }}/issue.md
